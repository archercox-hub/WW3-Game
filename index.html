<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Massive WW3 World Server</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
  body { background: #090d16; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  header { background: #161f30; border-bottom: 1px solid #2a3954; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .title { font-weight: 800; font-size: 1.05rem; color: #38bdf8; }
  .badge { background: #0f172a; padding: 5px 10px; border-radius: 6px; border: 1px solid #2a3954; font-size: 0.82rem; }
  .res { display: flex; gap: 10px; font-size: 0.82rem; }
  .res span { font-weight: bold; color: #38bdf8; }
  button { background: #38bdf8; color: #090d16; border: none; padding: 7px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.8rem; }
  button:hover { background: #0284c7; color: white; }
  button:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
  .btn-danger { background: #ef4444; color: white; }
  .main { display: flex; flex: 1; overflow: hidden; }
  .map-area { flex: 1; background: #060910; overflow: auto; display: flex; justify-content: center; align-items: center; }
  svg { width: 1060px; height: 640px; background: #0a111e; border: 2px solid #2a3954; border-radius: 8px; }
  .prov { stroke: #090d16; stroke-width: 2; cursor: pointer; }
  .prov:hover { opacity: 0.85; stroke: #ffffff; stroke-width: 2.5; }
  .prov.selected { stroke: #facc15; stroke-width: 3.5; }
  .label { fill: #ffffff; font-size: 11px; font-weight: bold; pointer-events: none; }
  .sidebar { width: 410px; background: #161f30; border-left: 1px solid #2a3954; display: flex; flex-direction: column; }
  .tabs { display: flex; border-bottom: 1px solid #2a3954; }
  .tab { flex: 1; padding: 10px 6px; text-align: center; background: #0f172a; color: #94a3b8; cursor: pointer; font-weight: bold; font-size: 0.8rem; }
  .tab.active { background: #161f30; color: #38bdf8; border-bottom: 2px solid #38bdf8; }
  .pane { flex: 1; overflow-y: auto; padding: 14px; display: none; }
  .pane.active { display: block; }
  h3 { font-size: 0.92rem; margin-bottom: 8px; color: #38bdf8; border-bottom: 1px solid #2a3954; padding-bottom: 4px; }
  p { font-size: 0.8rem; color: #94a3b8; margin-bottom: 10px; line-height: 1.4; }
  .card { background: #0f172a; border: 1px solid #2a3954; border-radius: 6px; padding: 10px; margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 7px 10px; border-radius: 4px; margin-bottom: 6px; font-size: 0.78rem; }
  .logs { height: 130px; background: #060910; border-top: 1px solid #2a3954; padding: 10px; overflow-y: auto; font-size: 0.75rem; font-family: monospace; }
</style>
</head>
<body>

<header>
  <div class="title">MASSIVE WW3 SERVER</div>
  <div class="badge">Your Country: <strong id="my-country-name">Loading...</strong> | Day <strong id="world-day">1</strong> | <strong id="net-status">Local Mode</strong></div>
  <div class="res">
    <div class="badge">Supplies: <span id="r-sup">0</span></div>
    <div class="badge">Components: <span id="r-comp">0</span></div>
    <div class="badge">Fuel: <span id="r-fuel">0</span></div>
    <div class="badge">Research: <span id="r-res">0</span></div>
  </div>
  <button id="btn-next-day">Advance World Day</button>
</header>

<div class="main">
  <div class="map-area">
    <svg id="map" viewBox="0 0 1060 640"></svg>
  </div>
  <div class="sidebar">
    <div class="tabs">
      <div class="tab active" data-p="territory">Territory</div>
      <div class="tab" data-p="mobilize">Mobilize (12)</div>
      <div class="tab" data-p="research">Research</div>
      <div class="tab" data-p="world">Active Nations</div>
    </div>
    <div class="pane active" id="p-territory"></div>
    <div class="pane" id="p-mobilize"></div>
    <div class="pane" id="p-research"></div>
    <div class="pane" id="p-world"></div>
    <div class="logs" id="logs"></div>
  </div>
</div>
